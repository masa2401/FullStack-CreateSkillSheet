name: Fullstack Automated Tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      lambda: ${{ steps.filter.outputs.lambda }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'vue-frontend/**'
            backend:
              - 'spring-backend/**'
            lambda:
              - 'aws-lambda/**'

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./vue-frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./vue-frontend

      - name: Type check
        run: npm run type-check
        working-directory: ./vue-frontend

      - name: Lint
        run: npm run lint
        working-directory: ./vue-frontend

      - name: Run Frontend tests
        run: npm run test:unit
        working-directory: ./vue-frontend

  e2e-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRイベント時はchromiumのみ、main pushや手動実行時は3ブラウザ全部を並列実行
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./vue-frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./vue-frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('./vue-frontend/package-lock.json') }}

      - name: Install Playwright browsers (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: ./vue-frontend

      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        working-directory: ./vue-frontend

      - name: Run Playwright E2E tests
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: ./vue-frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: ./vue-frontend/playwright-report/
          retention-days: 7

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Backend tests (Maven)
        run: mvn test
        working-directory: ./spring-backend

  lambda-changed-flag:
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Save flag to file
        run: echo "${{ needs.changes.outputs.lambda }}" > lambda-changed.txt

      - name: Upload flag as artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-changed-flag
          path: lambda-changed.txt
