name: Fullstack Automated Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          # フロントエンド用のpackage-lock.jsonの場所を指定
          cache-dependency-path: './vue-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./vue-frontend

      - name: Type check
        run: npm run type-check
        working-directory: ./vue-frontend

      - name: Lint
        run: npm run lint
        working-directory: ./vue-frontend

      - name: Run Frontend tests
        run: npm run test:unit
        working-directory: ./vue-frontend

  backend-test:
    runs-on: ubuntu-latest

    # 1. サービスコンテナとしてPostgreSQLを起動
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend tests (Maven)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
        run: mvn test
        working-directory: ./spring-backend

  detect-lambda-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # before/after間のdiffを取るため全履歴を取得

      - name: Check for aws-lambda changes
        id: filter
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- aws-lambda/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save flag to file
        run: echo "${{ steps.filter.outputs.changed }}" > lambda-changed.txt

      - name: Upload flag as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-changed-flag
          path: lambda-changed.txt
