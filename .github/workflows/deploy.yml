name: Build and Deploy Backend to Railway

on:
  workflow_run:
    workflows: ['Fullstack Automated Tests']
    types: [completed]
    branches: [main]

jobs:
  flags:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.read.outputs.backend }}
      lambda: ${{ steps.read.outputs.lambda }}
    steps:
      - name: Download deploy flags artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-flags
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read flags
        id: read
        run: |
          echo "backend=$(cat backend-changed.txt)" >> "$GITHUB_OUTPUT"
          echo "lambda=$(cat lambda-changed.txt)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: flags
    if: needs.flags.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./spring-backend
          file: ./spring-backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway redeploy --service ${{ secrets.RAILWAY_SERVICE_NAME }} -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  build-and-deploy-lambda:
    needs: flags
    if: needs.flags.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Lambda image
        uses: docker/build-push-action@v7
        with:
          context: ./aws-lambda
          file: ./aws-lambda/Dockerfile
          push: true
          # Lambda は OCI Image Index（Manifest List）に非対応で、
          # Docker v2 manifest しか受け付けない。buildx は既定で provenance / sbom の
          # attestation を付け、その結果 OCI Image Index になってしまうため明示的に無効化する。
          provenance: false
          sbom: false
          tags: ${{ steps.ecr-login.outputs.registry }}/skillsheet-pdf-generator:latest
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,mode=max,scope=lambda

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name skillsheet-pdf-generator \
            --image-uri ${{ steps.ecr-login.outputs.registry }}/skillsheet-pdf-generator:latest
